<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E5F">
<title>QR de asistencia · Encargadas</title>
<style>
  :root{--bg:#F4F1EA;--card:#fff;--ink:#1D2A30;--muted:#5B6B72;--line:#DCD6CA;--pri:#1F4E5F;--pri-soft:#E3EEF1;--ok:#1E7B4F;--ok-soft:#DDF2E6;--bad:#B3261E;--bad-soft:#FBE3E1;--warn:#8A5A00;--warn-soft:#FFF0CC}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .top h1{margin:0;font-size:26px;flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .login{max-width:440px;margin:40px auto}
  label{display:block;font-weight:700;margin:14px 0 6px}
  select,input{width:100%;font-size:20px;border:2px solid var(--line);border-radius:12px;padding:13px;background:#fff}
  .btn{border:none;border-radius:12px;padding:14px 20px;font-size:18px;font-weight:800;background:var(--pri);color:#fff;cursor:pointer}
  .btn.full{width:100%;margin-top:18px}
  .btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
  .btn.ok{background:var(--ok)} .btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad)}
  .btn.sm{padding:9px 14px;font-size:15px}
  .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
  .qrbox{text-align:center}
  #qr{background:#fff;padding:14px;border-radius:16px;display:inline-block;line-height:0}
  #qr svg{width:min(78vw,430px);height:auto}
  .bar{height:10px;background:#EEE9DF;border-radius:99px;overflow:hidden;margin:14px auto 6px;max-width:430px}
  .bar i{display:block;height:100%;background:var(--pri);transition:width 1s linear}
  .hint{color:var(--muted);font-size:16px}
  .aviso{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-weight:600}
  .reg{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #EEE9DF;flex-wrap:wrap}
  .reg:last-child{border:none}
  .reg .who{flex:1;min-width:160px}
  .reg .who b{display:block}
  .reg small{color:var(--muted)}
  .pill{border-radius:999px;padding:3px 11px;font-size:14px;font-weight:800}
  .ACEPTADO{background:var(--ok-soft);color:var(--ok)} .RECHAZADO{background:var(--bad-soft);color:var(--bad)} .PENDIENTE{background:var(--warn-soft);color:var(--warn)}
  .acts{display:flex;gap:8px;width:100%;flex-wrap:wrap;margin-top:4px}
  .err{color:var(--bad);font-weight:700;margin-top:10px}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:14px;font-weight:700;display:none;z-index:9;max-width:92%}
  .menu{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .ubic{background:var(--ok-soft);color:#14532d;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:16px}
  .ubic a{color:var(--pri);font-weight:700}
  h2{font-size:20px;margin:0 0 10px}
  .tabs{display:flex;gap:8px;margin:16px 0 4px}
  .tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px;font-weight:800;color:var(--muted);cursor:pointer}
  .tabs button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  .cfg{max-width:620px;margin:0 auto}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .o{text-align:center;color:var(--muted);font-weight:700;margin:14px 0 0}
  .pinbox{background:var(--pri-soft);color:var(--pri);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:16px}
  .pinbox b{font-size:22px;letter-spacing:3px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>

    j = await r.json();
  } catch (e) { j = { ok: false, error: 'OCUPADO: sin conexión' }; }
  if (!j.ok && /^OCUPADO/.test(j.error || '') && intento < 3) { await new Promise(r => setTimeout(r, 1500 * (intento + 1) + Math.random() * 1500)); return api(accion, datos, intento + 1); }
  if (!j.ok) throw new Error(String(j.error || 'Error').replace(/^OCUPADO: /, ''));
  return j;
}
function distM(a1, o1, a2, o2) { const R = 6371000, r = x => x * Math.PI / 180, dA = r(a2 - a1), dO = r(o2 - o1); const h = Math.sin(dA / 2) ** 2 + Math.cos(r(a1)) * Math.cos(r(a2)) * Math.sin(dO / 2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(h))); }
function fDist(m) { return m >= 2000 ? (m / 1000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' km' : m + ' m'; }
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.style.background = err ? 'var(--bad)' : 'var(--ink)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 3000); }
const ses = { get() { try { return JSON.parse(sessionStorage.getItem('tdt_enc') || 'null'); } catch (e) { return null; } }, set(v) { try { sessionStorage.setItem('tdt_enc', JSON.stringify(v)); } catch (e) {} }, del() { try { sessionStorage.removeItem('tdt_enc'); } catch (e) {} } };

// ---------- ingreso ----------
let MODO = 'sede';
async function login(error, previa) {
  S.timers.forEach(clearInterval); S.timers = [];
  const esCap = MODO === 'cap';
  $('#app').innerHTML = `<div class="card login"><h1 style="margin:0 0 6px">QR de asistencia</h1><p class="hint" style="margin:0">Para encargadas</p>
    <div class="tabs"><button id="tSede" class="${esCap ? '' : 'on'}">🏠 Sede</button><button id="tCap" class="${esCap ? 'on' : ''}">🎓 Capacitación</button></div>
    ${esCap ? `<label>Capacitación de hoy</label><select id="cap"><option>Cargando…</option></select>
      <label>¿Con qué PIN entrás?</label><select id="sede"><option value="">PIN de la capacitación</option></select>
      <label id="lpin">PIN</label>`
    : `<label>Sede</label><select id="sede"><option>Cargando…</option></select><label>PIN de la sede</label>`}
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    <button class="btn full" id="entrar">Entrar</button></div>`;
  $('#tSede').onclick = () => { MODO = 'sede'; login(); };
  $('#tCap').onclick = () => { MODO = 'cap'; login(); };
  const ult = (previa && previa.sede) || localStorage.getItem('tdt_sede');
  try {
    const r = await api('sedes', {});
    $('#sede').innerHTML = (esCap ? '<option value="">PIN de la capacitación</option>' + r.sedes.map(x => `<option value="${esc(x)}">PIN de mi sede: ${esc(x)}</option>`).join('')
      : '<option value="">Elegí tu sede…</option>' + r.sedes.map(x => `<option>${esc(x)}</option>`).join(''));
    if (ult) $('#sede').value = ult;
    if (esCap && previa && previa.sede === '') $('#sede').value = '';
  } catch (e) { if (!esCap) $('#sede').innerHTML = '<option value="">No se pudo cargar</option>'; }
  if (esCap) {
    try {
      const r = await api('capsHoy', {});
      $('#cap').innerHTML = r.caps.length ? r.caps.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}${c.lista ? '' : ' (falta cargar el lugar)'}</option>`).join('')
        : '<option value="">No hay capacitaciones cargadas para hoy</option>';
      if (previa && previa.cap) $('#cap').value = previa.cap;
    } catch (e) { $('#cap').innerHTML = '<option value="">No se pudo cargar</option>'; }
  }
  $('#pin').onkeydown = e => { if (e.key === 'Enter') $('#entrar').click(); };
  $('#entrar').onclick = async () => {
    const sede = $('#sede').value, pin = $('#pin').value.trim(), cap = esCap ? $('#cap').value : '';
    if (esCap && !cap) return login('No hay una capacitación de hoy para elegir. La coordinación la crea en el panel (Capacitaciones → Nueva).', { sede });
    if ((!esCap && !sede) || !pin) return login(esCap ? 'Escribí el PIN' : 'Elegí la sede y escribí el PIN', { sede, cap });
    $('#entrar').disabled = true; $('#entrar').textContent = 'Entrando…';
    try {
      const r = await api('encargadaLogin', esCap ? { cap, sede, pin } : { sede, pin });
      try { if (sede) localStorage.setItem('tdt_sede', sede); } catch (e) {}
      entrar(r);
    } catch (e) { login(e.message, { sede, cap }); }
  };
}
const CAMPOS = ['sede', 'tok', 'tipo', 'nombre', 'tieneUbicacion', 'radio', 'lat', 'lng', 'direccion', 'desde', 'hasta', 'pinCap'];
function entrar(r) {
  CAMPOS.forEach(k => S[k] = r[k] == null ? '' : r[k]);
  const g = { dia: new Date().toDateString() }; CAMPOS.forEach(k => g[k] = S[k]); ses.set(g);
  principal();
}

// ---------- pantalla principal ----------
function principal() {
  const esCap = S.tipo === 'CAP';
  if (esCap && !S.tieneUbicacion) return configurarCap();
  const horario = S.desde || S.hasta ? ` · horario <b>${esc(S.desde || '…')}–${esc(S.hasta || '…')}</b>` : '';
  $('#app').innerHTML = `<div class="top"><h1>${esc(esCap ? S.nombre : S.sede)}<div class="hint" style="font-weight:400">${esc(esCap ? 'Capacitación · hoy' : S.nombre || '')}</div></h1>
      <button class="btn sec sm" id="salir">Salir</button></div>
    ${S.tieneUbicacion ? `<div class="ubic">📍 <b>${esc(S.direccion || S.nombre || S.sede)}</b> · se acepta hasta <b>${esc(S.radio)} m</b>${horario} ·
        <a href="https://www.google.com/maps?q=${S.lat},${S.lng}" target="_blank" rel="noopener">Ver en el mapa ↗</a></div>`
      : `<div class="aviso">⚠️ Esta sede todavía no tiene ubicación cargada, así que nadie puede registrarse. Estando en la sede, tocá <b>“Guardar ubicación de la sede”</b>.</div>`}
    <div id="chequeo"></div>
    ${esCap && S.pinCap ? `<div class="pinbox">Otras encargadas pueden mostrar este mismo QR en su celular o compu: pestaña <b style="font-size:16px;letter-spacing:0">🎓 Capacitación</b> y PIN <b>${esc(S.pinCap)}</b> (o el PIN de su sede).</div>` : ''}
    <div class="grid">
      <div class="card qrbox"><h2>Escaneá con la cámara del celular</h2>
        <div id="qr"></div><div class="bar"><i id="bar" style="width:100%"></i></div>
        <div class="hint" id="cuenta">El código cambia cada minuto</div></div>
      <div class="card"><h2>${esCap ? 'Registros de la capacitación' : 'Registros de hoy'} <span class="hint" id="cant"></span></h2><div id="lista"><p class="hint">Todavía no hay registros.</p></div>
        ${esCap ? '<p class="hint" style="margin-top:12px">La lista se comparte entre todas las encargadas que tienen abierto este QR.</p><div class="menu"><button class="btn sec sm" id="corregir">📍 Corregir el lugar</button></div>'
          : `<div class="menu">${S.tieneUbicacion ? '' : '<button class="btn sec sm" id="ubic">📍 Guardar ubicación de la sede</button>'}<button class="btn sec sm" id="cerrar">Cerrar el día</button></div>`}</div>
    </div>`;
  $('#salir').onclick = salir;
  if ($('#ubic')) $('#ubic').onclick = guardarUbicacion;
  if ($('#cerrar')) $('#cerrar').onclick = cerrarDia;
  if ($('#corregir')) $('#corregir').onclick = () => configurarCap('', true);
  if (S.tieneUbicacion) chequearDistancia();
  pantallaEncendida();
  nuevoQr(); cargarLista();
  S.timers.push(setInterval(cargarLista, 15000));
}
/** Compara la ubicación de la encargada con el punto guardado: si está lejos, el punto probablemente está mal. */
function chequearDistancia() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const d = distM(p.coords.latitude, p.coords.longitude, +S.lat, +S.lng), acc = Math.round(p.coords.accuracy);
    const el = $('#chequeo'); if (!el) return;
    if (d <= +S.radio + Math.min(acc, 300)) { el.innerHTML = `<div class="hint" style="margin:-8px 0 14px">✔ Estás a ${fDist(d)} del punto guardado.</div>`; return; }
    el.innerHTML = `<div class="aviso">⚠️ Según este equipo estás a <b>${fDist(d)}</b> del punto guardado${acc > 100 ? ` (tu ubicación es aproximada: ±${fDist(acc)})` : ''}.
      Si estás en el lugar, el punto está mal y nadie va a poder registrarse. ${S.tipo === 'CAP' ? 'Tocá <b>“Corregir el lugar”</b>' : 'Avisale a la coordinación para que lo corrija desde el panel'}.
      <a href="https://www.google.com/maps?q=${S.lat},${S.lng}" target="_blank" rel="noopener">Ver el punto guardado ↗</a></div>`;
  }, () => {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
function salir() { clearTimeout(siguiente); clearInterval(S._tic); ses.del(); MODO = S.tipo === 'CAP' ? 'cap' : 'sede'; S.tipo = ''; login(); }

// ---------- capacitación sin lugar: la encargada lo carga ----------
function configurarCap(error, corregir) {
  S.timers.forEach(clearInterval); S.timers = []; clearTimeout(siguiente); clearInterval(S._tic);
  $('#app').innerHTML = `<div class="top"><h1>${esc(S.nombre)}<div class="hint" style="font-weight:400">Capacitación · hoy</div></h1><button class="btn sec sm" id="salir">Salir</button></div>
    <div class="card cfg"><h2>📍 ${corregir ? 'Corregir el lugar de la capacitación' : '¿Dónde es la capacitación?'}</h2>
      <p class="hint" style="margin-top:0">${corregir ? 'Se puede corregir mientras nadie se haya registrado todavía.' : 'Se carga una vez. Se puede corregir mientras nadie se haya registrado.'}</p>
      <label>Dirección (es lo que van a ver todos)</label><input id="dir" name="lugar-capacitacion" autocomplete="off" placeholder="Ej: Av. Siempre Viva 123, Del Viso" maxlength="200" value="${esc(S.direccion || '')}">
      <div class="row2"><div><label>Desde (opcional)</label><input id="desde" type="time" value="${esc(S.desde || '')}"></div><div><label>Hasta (opcional)</label><input id="hasta" type="time" value="${esc(S.hasta || '')}"></div></div>
      <label>Distancia permitida (metros)</label><input id="radio" type="number" inputmode="numeric" value="${esc(S.radio || 300)}" min="50" max="2000">
      ${error ? `<div class="err">${esc(error)}</div>` : ''}
      <div id="propuesta"></div>
      <button class="btn full" id="gps">📍 Usar mi ubicación actual (celular, estando en el lugar)</button>
      <button class="btn sec full" id="buscar">🔎 Buscar la dirección en el mapa</button>
      <p class="o">— o —</p>
      <label>Pegá el link de Google Maps del lugar</label><input id="link" name="link-mapa" autocomplete="off" placeholder="https://maps.app.goo.gl/…">
      <button class="btn sec full" id="conLink">Guardar con el link</button>
      ${corregir ? '<button class="btn sec full" id="volver">← Volver al QR</button>' : ''}</div>`;
  $('#salir').onclick = salir;
  if ($('#volver')) $('#volver').onclick = principal;
  const datos = () => ({ sede: S.sede, tok: S.tok, direccion: $('#dir').value.trim(), desde: $('#desde').value, hasta: $('#hasta').value, radio: $('#radio').value });
  const ocupado = (b, on, txt) => { b.disabled = on; if (txt) b.textContent = txt; };
  const enviar = async (extra, boton) => {
    const d = Object.assign(datos(), extra);
    if (!d.direccion) return toast('Escribí la dirección del lugar', true);
    const txt = boton.textContent; ocupado(boton, true, 'Guardando…');
    try { const r = await api('guardarUbicacion', d); entrar(Object.assign(r, { tok: S.tok })); toast('✔ Lugar guardado: revisá que el punto del mapa sea correcto'); }
    catch (e) { ocupado(boton, false, txt); toast(e.message, true); }
  };
  $('#conLink').onclick = () => { if (!$('#link').value.trim()) return toast('Pegá el link de Google Maps', true); enviar({ link: $('#link').value.trim() }, $('#conLink')); };
  $('#buscar').onclick = async () => {
    const d = datos(); if (!d.direccion) return toast('Escribí la dirección del lugar', true);
    const b = $('#buscar'); ocupado(b, true, 'Buscando…');
    try {
      const r = await api('guardarUbicacion', Object.assign(d, { buscar: true })), q = r.propuesta;
      $('#propuesta').innerHTML = `<div class="pinbox" style="margin-top:16px">¿Es este lugar? <b style="font-size:17px;letter-spacing:0">${esc(q.texto)}</b>
        ${q.exacto ? '' : '<br>⚠️ Google no encontró la dirección exacta: revisá bien el mapa.'}<br><a href="https://www.google.com/maps?q=${q.lat},${q.lng}" target="_blank" rel="noopener">Abrir en el mapa para controlar ↗</a>
        <div class="menu"><button class="btn ok sm" id="si">Sí, es acá</button><button class="btn bad sm" id="no">No</button></div></div>`;
      $('#si').onclick = () => enviar({ lat: q.lat, lng: q.lng, acc: 0, confirmada: true }, $('#si'));
      $('#no').onclick = () => { $('#propuesta').innerHTML = '<p class="hint">Probá escribir la dirección con la localidad, usar el celular en el lugar o pegar el link.</p>'; };
    } catch (e) { toast(e.message, true); }
    ocupado(b, false, '🔎 Buscar la dirección en el mapa');
  };
  $('#gps').onclick = () => {
    if (!$('#dir').value.trim()) return toast('Primero escribí la dirección del lugar', true);
    if (!navigator.geolocation) return toast('Este navegador no permite obtener la ubicación', true);
    const b = $('#gps'); ocupado(b, true, 'Obteniendo ubicación… (10 s)');
    let mejor = null;
    const w = navigator.geolocation.watchPosition(p => { if (!mejor || p.coords.accuracy < mejor.coords.accuracy) mejor = p; },
      () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    setTimeout(() => {
      navigator.geolocation.clearWatch(w); ocupado(b, false, '📍 Usar mi ubicación actual (celular, estando en el lugar)');
      if (!mejor) return toast('No se pudo obtener la ubicación: activá el GPS y permití el acceso, o usá "Buscar la dirección"', true);
      if (mejor.coords.accuracy > 60) return toast('Tu equipo da una ubicación aproximada (±' + Math.round(mejor.coords.accuracy) + ' m), algo común en computadoras. Usá el celular, "Buscar la dirección" o el link.', true);
      enviar({ lat: mejor.coords.latitude, lng: mejor.coords.longitude, acc: mejor.coords.accuracy }, b);
    }, 10000);
  };
}
let restante = 30, siguiente = null;
async function nuevoQr() {
  clearTimeout(siguiente);
  try {
    const r = await api('qr', { sede: S.sede, tok: S.tok });
    const url = new URL('marcar.html', location.href); url.search = '?s=' + encodeURIComponent(S.sede) + '&t=' + encodeURIComponent(r.t);
    window.__ultimaUrl = url.toString();
    const q = qrcode(0, 'M'); q.addData(url.toString()); q.make();
    $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    restante = r.segundos; S.periodo = r.periodo || 60; tic();
    siguiente = setTimeout(nuevoQr, Math.max(3, r.segundos) * 1000);
  } catch (e) {
    if (/Sesión vencida/.test(e.message)) { ses.del(); return login(e.message); }
    $('#cuenta').textContent = 'Sin conexión, reintentando…'; siguiente = setTimeout(nuevoQr, 5000);
  }
}
function tic() {
  clearInterval(S._tic);
  const tot = S.periodo || 60;
  const pintar = () => { $('#bar').style.width = Math.max(0, restante / tot * 100) + '%'; $('#cuenta').textContent = `El código cambia en ${Math.max(0, restante)} s`; };
  pintar(); S._tic = setInterval(() => { restante--; pintar(); }, 1000);
}
async function cargarLista() {
  try {
    const r = await api('hoy', { sede: S.sede, tok: S.tok });
    const l = r.registros.filter(x => x.resultado !== 'UBICACIÓN' && x.resultado !== 'INGRESO');
    const ok = l.filter(x => x.resultado === 'ACEPTADO').length, pen = l.filter(x => x.resultado === 'PENDIENTE').length;
    $('#cant').textContent = `· ${ok} presentes${pen ? ` · ${pen} pendientes` : ''}`;
    $('#lista').innerHTML = l.length ? l.map(x => `<div class="reg"><div class="who"><b>${esc(x.nombre || 'Sin identificar')}</b><small>${esc(x.hora)} hs${x.motivo ? ' · ' + esc(x.motivo) : ''}</small></div>
      <span class="pill ${esc(x.resultado)}">${x.resultado === 'ACEPTADO' ? '✔ Presente' : x.resultado === 'PENDIENTE' ? '⏳ Pendiente' : '✘ Rechazado'}</span>
      ${x.resultado === 'PENDIENTE' ? `<div class="acts"><button class="btn ok sm" onclick="decidir('${x.id}','APROBAR',${/distinto/.test(x.motivo)})">Aprobar</button><button class="btn bad sm" onclick="decidir('${x.id}','RECHAZAR')">Rechazar</button></div>` : ''}</div>`).join('')
      : '<p class="hint">Todavía no hay registros.</p>';
  } catch (e) { if (/Sesión vencida/.test(e.message)) { ses.del(); login(e.message); } }
}
async function decidir(id, decision, puedeVincular) {
  let vincular = false;
  if (decision === 'APROBAR') {
    if (!confirm(S.tipo === 'CAP' ? '¿Confirmás que esta persona está presente en la capacitación?' : '¿Confirmás que esta persona está presente en la sede?')) return;
    if (puedeVincular) vincular = confirm('¿Es su celular nuevo? Si aceptás, las próximas veces se registra sin pedir aprobación.');
  } else if (!confirm('¿Rechazar este registro?')) return;
  try { await api('decidir', { sede: S.sede, tok: S.tok, registro: id, decision, vincular }); toast(decision === 'APROBAR' ? '✔ Aprobado' : 'Rechazado'); cargarLista(); }
  catch (e) { toast(e.message, true); }
}
function guardarUbicacion() {
  if (!confirm('Hacelo estando en la sede (idealmente en la entrada). ¿Guardar esta ubicación como la de ' + S.sede + '?')) return;
  if (!navigator.geolocation) return toast('Este navegador no permite obtener la ubicación', true);
  toast('Obteniendo ubicación…');
  let mejor = null;
  const w = navigator.geolocation.watchPosition(p => { if (!mejor || p.coords.accuracy < mejor.coords.accuracy) mejor = p; }, e => toast('No se pudo obtener la ubicación: activá el GPS y permití el acceso', true), { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  setTimeout(async () => {
    navigator.geolocation.clearWatch(w);
    if (!mejor) return toast('No se pudo obtener la ubicación', true);
    try {
      const r = await api('guardarUbicacion', { sede: S.sede, tok: S.tok, lat: mejor.coords.latitude, lng: mejor.coords.longitude, acc: mejor.coords.accuracy });
      Object.assign(S, { tieneUbicacion: true, lat: r.lat, lng: r.lng }); const s = ses.get(); if (s) { Object.assign(s, { tieneUbicacion: true, lat: r.lat, lng: r.lng }); ses.set(s); }
      toast('✔ Ubicación guardada (precisión ' + Math.round(mejor.coords.accuracy) + ' m)'); principal();
    } catch (e) { toast(e.message, true); }
  }, 10000);
}
async function cerrarDia() {
  if (!confirm('Se va a marcar AUSENTE a quienes tenían que venir hoy a esta sede y no registraron asistencia. ¿Seguir?')) return;
  try {
    const r = await api('cerrarDia', { sede: S.sede, tok: S.tok });
    alert(r.ausentes.length ? 'Marcados como ausentes:\n\n' + r.ausentes.map(x => '• ' + x.replace(/\s+\(ED-\d+\)$/, '')).join('\n') : 'No hay ausentes: todos los que tenían que venir hoy se registraron.');
  } catch (e) { toast(e.message, true); }
}
async function pantallaEncendida() { try { if (navigator.wakeLock) { S.wl = await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') S.wl = await navigator.wakeLock.request('screen'); }); } } catch (e) {} }

// ---------- inicio ----------
if (API_URL.indexOf('http') !== 0) $('#app').innerHTML = '<div class="card login"><h1>Falta configurar</h1><p>Pegá la URL de Apps Script en API_URL dentro de encargada.html.</p></div>';
else { const s = ses.get(); if (s && s.dia === new Date().toDateString()) { Object.assign(S, s); MODO = S.tipo === 'CAP' ? 'cap' : 'sede'; principal(); } else login(); }
</script>
